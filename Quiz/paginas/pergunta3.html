<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quiz Kindergarten - Pergunta 3</title>
        <link rel="stylesheet" href="./estilos/style-kinder.css">
    </head>
    <body>
        <img src="../BG/BGkindergarden.png" alt="Background Kindergarten" class="imagem-fundo">

        <div class="quiz-container">
            <div class="Pergunta">
                <h1>No primeiro jogo, qual é o item específico que voce <br>deve colocar no cubículo de Jerome para <br>incrimina-lo a pedido de Lily?</h1>
            </div>

            <div class="pergunta-opcao" data-opcao="A">
                <div class="caixa-da-pergunta">
                    <img src="../caixas de texto/banner(kindergarden)/Prota.png" alt="Opção A">
                </div>
                <p>(A) A cabeça decaptada do Nugget</p>
            </div>

            <div class="pergunta-opcao" data-opcao="B">
                <div class="caixa-da-pergunta">
                    <img src="../caixas de texto/banner(kindergarden)/garotaChata.jpg" alt="Opção B">
                </div>
                <p>(B) O dispositivo a laser do diretor</p>
            </div>

            <div class="pergunta-opcao" data-opcao="C">
                <div class="caixa-da-pergunta">
                    <img src="../caixas de texto/banner(kindergarden)/muleta.jpg" alt="Opção C">
                </div>
                <p>(C) Um cigarro aceso</p>
            </div>

            <div class="pergunta-opcao" data-opcao="D">
                <div class="caixa-da-pergunta">
                    <img src="../caixas de texto/banner(kindergarden)/nugget.jpg" alt="Opção D">
                </div>
                <p>(D) Uma foto da Lily com o cabelo cortado</p>
            </div>
        </div>
        <script src="../javascript/quiz-logica.js"></script>
    </body>
</html>
