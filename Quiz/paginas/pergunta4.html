<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quiz Red Dead Redemption 2 - Pergunta 4</title>
        <link rel="stylesheet" href="../paginas/estilos/style-rdr2.css">
    </head>
    <body>
        <img src="../BG/BGRDR2.jpg" alt="Background Red Dead Redemption 2" class="imagem-fundo">

        <div class="quiz-container">
            <div class="pergunta-titulo">
                <h1>Qual é o nome do cavalo original de Arthur Morgan que morreu antes do início dos eventos do jogo, mencionado por ele em conversas no acampamento?</h1>
            </div>

            <div class="placas-container">
                <img src="../caixas de texto/banner(RDR2)/RDR2.png" alt="Placas de Sinalização" class="imagem-placas">
                
                <div class="opcao-texto opcao-a" data-opcao="A">
                    <p>(A) Silver Dollar</p>
                </div>

                <div class="opcao-texto opcao-b" data-opcao="B">
                    <p>(B) Boadicea</p>
                </div>

                <div class="opcao-texto opcao-c" data-opcao="C">
                    <p>(C) Baylock</p>
                </div>

                <div class="opcao-texto opcao-d" data-opcao="D">
                    <p>(D) The Count</p>
                </div>
            </div>
        </div>
        <script src="../javascript/quiz-logica.js"></script>
    </body>
</html>
