    <body>

                    <h1>Qual é o verdadeiro nome do King of Red Lions (o barco falante) <br>em The Legend of Zelda: The Wind Waker?</h1>
                </div>

                <div class="opcoes-lista">
                    <div class="opcao-item" data-opcao="A">
                        <p><strong>(A)</strong> King Daphnes Nohansen Hyrule.</p>
                    </div>

                    <div class="opcao-item" data-opcao="B">
                        <p><strong>(B)</strong> King Rhoam Bosphoramus Hyrule.</p>
                    </div>

                    <div class="opcao-item" data-opcao="C">
                        <p><strong>(C)</strong> Gustaf, the Ancient King.</p>
                    </div>

                    <div class="opcao-item" data-opcao="D">
                        <p><strong>(D)</strong> Gaepora of Skyloft.</p>
                    </div>
                </div>
            </div>
