<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="estilos/style-celest.css">
        <title>Quiz Celeste - Pergunta 1</title>
    </head>
    <body>
        <div class="quiz-container">
            <img src="../BG/BGceleste.jpg" alt="Celeste" class="imagem-fundo">
            <div class="Pergunta">
                <h1>Qual o combo de movimentos para  <br>fazer o super dash? </h1>
            </div>
            <div class="pergunta1" data-opcao="A">
                <p>Desh para frente + Pulo</p>
                <div class="caixa-da-pergunta">
                    <img src="../caixas de texto/banner(Celeste)/celeste.png" alt="Celeste" class="bgPergunta">
                </div>
            </div>
            <div class="pergunta2" data-opcao="B">
                <p>Desh para baixo + Pulo</p>
                <div class="caixa-da-pergunta">
                    <img src="../caixas de texto/banner(Celeste)/celesteReverso.png" alt="Celeste-Reverso" class="bgPergunta">
                </div>
            </div>
            <div class="pergunta3" data-opcao="C">
                <p>Desh na diagonal superior + Pulo</p>
                <div class="caixa-da-pergunta">
                    <img src="../caixas de texto/banner(Celeste)/negao.png" alt="Negao" class="bgPergunta">
                </div>
            </div>
            <div class="pergunta4" data-opcao="D">
                <p>Agacha + Dash para frente</p>
                <div class="caixa-da-pergunta">
                    <img src="../caixas de texto/banner(Celeste)/velha.png" alt="Velha" class="bgPergunta">
                </div>
            </div>
        </div>
        <script src="../javascript/quiz-logica.js"></script>
    </body>
</html>
