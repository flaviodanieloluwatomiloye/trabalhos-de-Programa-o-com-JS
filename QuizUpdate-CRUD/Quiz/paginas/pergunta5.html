<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quiz God of War - Pergunta 5</title>
        <link rel="stylesheet" href="../paginas/estilos/style-gow.css">
    </head>
    <body>
        <img src="../BG/BGgow.png" alt="Background God of War" class="imagem-fundo">

        <div class="quiz-container">
            <div class="pergaminho-container">
                <img src="../caixas de texto/banner(GOW)/gow.png" alt="Pergaminho Grego" class="imagem-pergaminho">
                
                <div class="pergaminho-conteudo">
                    <div class="pergunta-titulo">
                        <h1>Em God of War (2018), qual é o nome do anão que criou o Machado Leviatã junto com Brok e Sindri, mas que já faleceu antes dos eventos do jogo?</h1>
                    </div>

                    <div class="opcoes-lista">
                        <div class="opcao-item" data-opcao="A">
                            <p><strong>(A)</strong> Andvari</p>
                        </div>

                        <div class="opcao-item" data-opcao="B">
                            <p><strong>(B)</strong> Motsognir</p>
                        </div>

                        <div class="opcao-item" data-opcao="C">
                            <p><strong>(C)</strong> Nenhum, foram apenas Brok e Sindri.</p>
                        </div>

                        <div class="opcao-item" data-opcao="D">
                            <p><strong>(D)</strong> Ivaldi</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="../javascript/quiz-logica.js"></script>
    </body>
</html>
